[project]
name = "ratchetkit"
version = "1.1.0"
description = "X3DH/PQXDH key agreement and Double/Triple Ratchet with pluggable crypto primitives"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    # ML-KEM / ML-DSA need cryptography >= 45 (OpenSSL 3.5 bindings).
    "cryptography>=45.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.15.0",
]

[project.urls]
Repository = "https://github.com/parsapoorsh/ratchetkit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ratchetkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["ratchetkit"]
show_error_codes = true
pretty = true
