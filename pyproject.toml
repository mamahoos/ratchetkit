[project]
name = "ratchetkit"
version = "0.1.0"
description = "ExtendedTripleDiffieHellman key agreement and Double Ratchet with pluggable crypto primitives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ratchetkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
